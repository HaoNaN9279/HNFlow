# HNFlow bundle layer for DeepSeek Harness.
#
# This patch only INSERTS rows: the shipped presets (standard / minimal / ptc)
# and the VibeStack mode keep their own rows untouched. Everything HNFlow
# specific lives inside the `hnflow` agent preset, which becomes a new
# selectable mode.
#
# The preset's child list mirrors
# `@deepseek-ai/dsh-web-app/presets/standard.patch.yml` (DSH 0.2.1-rc.5).
# Presets have no inheritance, so this list is the anchor to revisit when the
# DSH minor version changes.
#
# Two ownership rules make this safe to install next to `dsh-vibestack`:
#
# - `dsh-vibestack`'s own preset row is untouched; the `vibestack` row below
#   mounts the same plugin inside THIS preset, which is how the HNFlow mode gets
#   capability groups as well as workflows.
# - `dsh-tool-workflow` already owns the `workflow` tool name, so the HNFlow
#   tool is called `hnflow`.

- insert:
    - id: preset-hnflow
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hnflow
        name: HNFlow
        description: 能力组 + HNFlow 确定性工作流（资产引用 / 工作区覆盖 / 人工节点）
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a VibeStack agent powered by the {{model}} model.
          # Host half of the VibeStack plugin: capability groups (rules, skills,
          # commands, MCP, agent persona) for the session, exactly as in the
          # `vibestack` mode. Remove this row for a workflows-only mode.
          - id: vibestack
            name: dsh-vibestack
          # Host half of this bundle: the `hnflow` tool, `/workflow`, and the
          # workflow index section.
          - id: hnflow
            name: dsh-hnflow
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
