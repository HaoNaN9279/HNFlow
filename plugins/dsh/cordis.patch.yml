# HNFlow bundle layer for DeepSeek Harness.
#
# This patch only INSERTS rows: the shipped presets (standard / minimal / ptc)
# and the HNFlow mode keep their own rows untouched. Everything HNFlow
# specific lives inside the `hnflow` agent preset, which becomes a new
# selectable mode, plus one root service row the page needs even when no HNFlow
# session is open.
#
# The preset's child list mirrors
# `@deepseek-ai/dsh-web-app/presets/standard.patch.yml` (DSH 0.2.1-rc.5).
# Presets have no inheritance, so this list is the anchor to revisit when the
# DSH minor version changes.
#
# Ownership rules:
#
# - Capability groups and model layers are provided by this same bundle: the
#   `hnflow` preset row mounts the capability surface, and `hnflow-core`
#   provides `ctx.capability` for every session. There is no second plugin.
# - `dsh-tool-workflow` already owns the `workflow` tool name, so the HNFlow
#   tool is called `hnflow`.

- insert:
    # Root row: `ctx.hnflow` (the orchestrator) and the page's Fetch routes.
    # It owns no session behaviour, so the page works without an HNFlow session.
    - id: hnflow-core
      name: dsh-hnflow
      config:
        role: core

    # Client half. It registers the sidebar page, the session tab, the right
    # sidebar page and the notice; it renders nothing outside its own surfaces.
    - id: hnflow-ui
      name: dsh-hnflow
      config:
        role: ui
        host: false

    # The clock: expiry, durable effects, `.hnflow/triggers.json`, stalled runs.
    # Its own row so a failing automation tick cannot take the page or the model
    # surface down with it. Disable this row to turn automation off entirely
    # (the plugin then only advances runs while a session is driving them).
    - id: hnflow-pass
      name: dsh-hnflow
      config:
        role: pass

    - id: preset-hnflow
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hnflow
        name: HNFlow
        description: 能力组 + HNFlow 约束式流程（节点契约 / 门禁 / 人工交付 / 独立验收）
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an HNFlow agent powered by the {{model}} model.
          # Capability groups, model layers and preview are mounted by the
          # `hnflow` row below; this bundle is a single plugin.
          # Host half of this bundle: the `hnflow` / `hnflow_author` tools,
          # `/hnflow`, the `hnflow-flows` skill and the flow index section.
          - id: hnflow
            name: dsh-hnflow
            config:
              role: preset
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves a plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it.

                    Explore first with non-mutating reads, searches, and checks. Do not edit files, change configuration, run formatters or code generation, commit, or otherwise carry out the plan. Resolve discoverable facts by inspection; use ask_user_question only for user-owned choices inspection cannot answer.

                    Make the plan decision-complete: goal and success criteria, changes grouped by subsystem, public API and data-flow changes, edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. When ready, call exit_plan_mode with the complete plan markdown starting with a # title, as the only and final tool call in that response.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
