name: Nightly Build

# Nightly build of the DeerFlow container images (backend, frontend), published
# to GHCR from the default branch.
#
# This mirrors the tag-driven release workflow (container.yaml) but trades the
# `v*` tag for date-based tags, since nightly ships unreleased `main`. The
# `verify-versions` gate is intentionally skipped - there is no tag to match -
# and `latest` is left untouched so it keeps tracking the last `v*` release.
# Images are amd64-only to match the release builds.
#
# Artifacts (under the running repo's owner):
#   ghcr.io/<owner>/deer-flow-{backend,frontend}:nightly
#   ghcr.io/<owner>/deer-flow-{backend,frontend}:nightly-YYYYMMDD
#
# Restricted to the upstream repo: every job is gated on
# `github.repository == 'bytedance/deer-flow'`, so a scheduled run or manual
# dispatch on a fork skips all jobs rather than pushing to the fork's own GHCR
# namespace. Scheduled workflows also only fire on the default branch.

on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC daily (adjust as needed)
  workflow_dispatch:

concurrency:
  group: nightly
  # Don't cancel a running nightly - a mid-cancel leaves a half-pushed set.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    if: github.repository == 'bytedance/deer-flow'
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
      nightly_version: ${{ steps.nightly_version.outputs.nightly_version }}
    steps:
      - name: Set nightly date (UTC)
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Compute nightly version
        id: nightly_version
        # Single source of truth for the nightly version string, injected into
        # the frontend image (About-page version).
        run: |
          set -euo pipefail
          BASE=$(grep -m1 '"version"' frontend/package.json | sed -E 's/.*"version":[[:space:]]*"([^"]+)".*/\1/')
          test -n "$BASE" || { echo "::error::empty base version from frontend/package.json"; exit 1; }
          SHORT_SHA="${GITHUB_SHA::7}"
          NIGHTLY="${BASE}-nightly.${{ steps.date.outputs.date }}-${SHORT_SHA}"
          echo "nightly_version=${NIGHTLY}" >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${NIGHTLY}"

  build-images:
    needs: prepare
    if: github.repository == 'bytedance/deer-flow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            file: backend/Dockerfile
            # Bake the `postgres` extra so shared-Postgres deployments can use it.
            build-args: "UV_EXTRAS=postgres"
          - component: frontend
            context: .
            file: frontend/Dockerfile
            build-args: ""
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.component }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - name: Log in to the Container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 #v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 #v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `nightly` rolls forward each run; `nightly-YYYYMMDD` is pinned to a
          # day but mutable within it (a same-day re-dispatch overwrites it);
          # `sha-<short>` is the only truly immutable tag. No `latest` (that
          # stays on v* releases) and no branch/tag refs.
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.prepare.outputs.date }}
            type=sha
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # APP_VERSION is consumed only by the frontend Dockerfile (it stamps
          # the About-page version); the backend Dockerfile doesn't declare it.
          # Passed via build-arg because build-push-action doesn't forward host
          # env into the BuildKit build.
          build-args: |
            ${{ matrix.build-args }}
            ${{ matrix.component == 'frontend' && format('APP_VERSION={0}', needs.prepare.outputs.nightly_version) || '' }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be #v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
