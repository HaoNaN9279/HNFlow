[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-transcribe"
version = "0.1.0"
description = "Download videos, extract audio, transcribe with Qwen3-ASR, and build an image-indexed Markdown transcript."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Vibe Stack" }]
keywords = ["video", "audio", "asr", "transcription", "yt-dlp", "ffmpeg", "qwen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "yt-dlp>=2025.1.15",
    "qwen-asr>=0.0.6",
    "torch>=2.6",
    "torchaudio>=2.6",
    "imageio-ffmpeg>=0.5.1",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "huggingface-hub>=0.27",
]

[project.optional-dependencies]
modelscope = ["modelscope>=1.20"]

[project.scripts]
video-transcribe = "video_transcribe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_transcribe"]

# GPU build of torch: use the machine's CUDA driver directly (no separate
# CUDA Toolkit is downloaded or managed). Resolve torch/torchaudio from the
# PyTorch CUDA index; everything else still comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]
