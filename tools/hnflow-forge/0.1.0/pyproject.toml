[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hnflow-forge"
version = "0.1.0"
description = "Offline lint and Markdown rendering for HNFlow flow definitions (schemaVersion 2)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Vibe Stack" }]
keywords = ["hnflow", "workflow", "lint", "dsh", "HNFlow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = []

[project.scripts]
hnflow-forge = "hnflow_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hnflow_forge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]
